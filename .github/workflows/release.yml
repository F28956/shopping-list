# Building the server where it is going to run, and attaching it to a release.
#
# This exists for two reasons beyond convenience.
#
# **It removes the cross-compiler.** `release/server-linux.sh` builds a Linux binary on
# a Mac, which needs a GCC cross toolchain from a third-party Homebrew tap and a set of
# environment variables aimed at three separate C dependencies. Here the runner is
# already Linux on x86_64, so there is nothing to cross.
#
# **It removes the account problem.** Uploading from a laptop needs a `gh` logged in as
# somebody who can write to this repository, and a machine with more than one GitHub
# account is a machine where that is sometimes the wrong one. `GITHUB_TOKEN` belongs to
# the repository and cannot be the wrong account.
#
# ## Why a container
#
# `ubuntu-latest` is Ubuntu 24.04, whose glibc is 2.39 — and a binary built against a
# glibc is refused by anything older. Building there would produce a server that will
# not start on Debian 12 or Ubuntu 22.04, failing at exec with a message naming a
# version, which is a miserable thing to hand somebody.
#
# 22.04 has glibc 2.35 and covers everything current. It is a floor chosen on purpose;
# raising it should be a decision rather than a side effect of a runner image moving.

name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be built without cutting a tag, when something here is being
  # changed and the whole point is to find out whether it works.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-latest
    container: ubuntu:22.04

    steps:
      - name: Tools the container does not have
        run: |
          apt-get update
          # curl and git for the checkout, build-essential and cmake for the three
          # dependencies here that compile C rather than Rust -- aws-lc-sys, ring and
          # libsqlite3-sys, which builds SQLite itself rather than linking the box's.
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential cmake pkg-config

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      # Against the committed .sqlx rather than a live database. Without this the build
      # wants a DATABASE_URL it could connect to, which is not a thing a release build
      # should need.
      - name: Test
        working-directory: web
        env:
          SQLX_OFFLINE: "true"
        # A release built from code that does not pass its tests is worse than no
        # release, because it looks like one.
        run: cargo test --workspace

      - name: Build
        working-directory: web
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release -p server

      - name: Name it, and say what it needs
        id: package
        run: |
          mkdir -p dist
          cp web/target/release/server dist/shopping-list-server
          cd dist
          sha256sum shopping-list-server > shopping-list-server.sha256

          # Read out of the file rather than assumed. A binary that is quietly the wrong
          # architecture, or wants a newer glibc than intended, is caught here and not by
          # somebody's server refusing to exec it.
          echo "### Server" >> "$GITHUB_STEP_SUMMARY"
          file shopping-list-server >> "$GITHUB_STEP_SUMMARY"
          floor=$(readelf -V shopping-list-server | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "needs $floor or newer" >> "$GITHUB_STEP_SUMMARY"
          echo "floor=$floor" >> "$GITHUB_OUTPUT"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FLOOR: ${{ steps.package.outputs.floor }}
        run: |
          notes=$(cat <<EOF
          The server, for x86_64 Linux.

          Needs **$FLOOR or newer** — Ubuntu 22.04, Debian 12, RHEL 9 and anything since.
          \`ldd --version\` on the box answers that before you copy anything.

          \`\`\`
          scp shopping-list-server you@your-server:/tmp/
          \`\`\`

          Then follow [running it as a service](https://github.com/F28956/shopping-list/blob/main/ops/README.md).
          Nothing else is needed: SQLite is compiled in, and TLS does not use the system OpenSSL.
          EOF
          )
          # `--clobber`, so re-running this for a tag replaces the file rather than
          # failing halfway and leaving a release with no binary on it.
          gh release create "$TAG" --title "$TAG" --notes "$notes" 2>/dev/null \
            || echo "release $TAG already exists; uploading to it"
          gh release upload "$TAG" \
            dist/shopping-list-server \
            dist/shopping-list-server.sha256 \
            --clobber
