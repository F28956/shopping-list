# Building the server where it is going to run, and attaching it to a release.
#
# This exists for two reasons beyond convenience.
#
# **It removes the cross-compiler.** `release/server-linux.sh` builds a Linux binary on
# a Mac, which needs a GCC cross toolchain from a third-party Homebrew tap and a set of
# environment variables aimed at three separate C dependencies. Here the runner is
# already Linux on x86_64, so there is nothing to cross.
#
# **It removes the account problem.** Uploading from a laptop needs a `gh` logged in as
# somebody who can write to this repository, and a machine with more than one GitHub
# account is a machine where that is sometimes the wrong one. `GITHUB_TOKEN` belongs to
# the repository and cannot be the wrong account.
#
# ## Why two jobs
#
# They need different machines, and trying to do both on one is what broke the first
# version of this file.
#
# The **build** runs in an `ubuntu:22.04` container. `ubuntu-latest` is Ubuntu 24.04,
# whose glibc is 2.39, and a binary is refused by anything older than the glibc it was
# built against — so building on the runner directly produces a server that will not
# start on Debian 12 or Ubuntu 22.04, failing at exec with a message naming a version.
# 22.04 gives 2.35, which covers everything current, and it is pinned so that the floor
# is a decision rather than a side effect of a runner image moving.
#
# The **release** runs on the plain runner, because that is where `gh` is. The GitHub
# CLI is part of the runner *image*, not of any container you ask it to run in, so a
# `gh` call inside the container fails with "gh: not found" — after a full build, which
# is the expensive place to find out.

name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be built without cutting a tag, when something here is being
  # changed and the whole point is to find out whether it works.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    outputs:
      floor: ${{ steps.package.outputs.floor }}
      described: ${{ steps.package.outputs.described }}

    steps:
      - name: Tools the container does not have
        run: |
          apt-get update
          # build-essential and cmake for the three dependencies here that compile C
          # rather than Rust -- aws-lc-sys, ring, and libsqlite3-sys, which builds
          # SQLite itself rather than linking the box's.
          #
          # `file` is its own package and is not pulled in by any of the others, which
          # is what broke the first version of this workflow. `readelf` needs no line
          # of its own: binutils comes with build-essential.
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential cmake pkg-config file

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      # Against the committed .sqlx rather than a live database. Without this the build
      # wants a DATABASE_URL it could connect to, which is not a thing a release build
      # should need.
      - name: Test
        working-directory: web
        env:
          SQLX_OFFLINE: "true"
        # A release built from code that does not pass its tests is worse than no
        # release, because it looks like one.
        run: cargo test --workspace

      - name: Build
        working-directory: web
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release -p server

      - name: Name it, and say what it needs
        id: package
        run: |
          mkdir -p dist
          cp web/target/release/server dist/shopping-list-server
          cd dist
          sha256sum shopping-list-server > shopping-list-server.sha256

          # Read out of the file rather than assumed. A binary that is quietly the wrong
          # architecture, or wants a newer glibc than intended, is caught here and not by
          # somebody's server refusing to exec it.
          described=$(file -b shopping-list-server)
          floor=$(readelf -V shopping-list-server | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)

          {
            echo "### Server"
            echo "\`$described\`"
            echo ""
            echo "Needs **$floor** or newer."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "floor=$floor" >> "$GITHUB_OUTPUT"
          echo "described=$described" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: server-x86_64-linux
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    # No container: `gh` lives on the runner image.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-x86_64-linux
          path: dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          FLOOR: ${{ needs.build.outputs.floor }}
          REPO: ${{ github.repository }}
        run: |
          notes=$(cat <<EOF
          The server, for x86_64 Linux.

          Needs **$FLOOR or newer** — Ubuntu 22.04, Debian 12, RHEL 9 and anything since.
          \`ldd --version\` on the box answers that before you copy anything.

          \`\`\`
          scp shopping-list-server you@your-server:/tmp/
          \`\`\`

          Then follow [running it as a service](https://github.com/$REPO/blob/main/ops/README.md).
          Nothing else is needed: SQLite is compiled in, and TLS does not use the system OpenSSL.
          EOF
          )
          # Created only if it is not already there, so re-running this for a tag
          # replaces the files rather than failing and leaving a release with none.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --notes "$notes"
          gh release upload "$TAG" \
            dist/shopping-list-server \
            dist/shopping-list-server.sha256 \
            --clobber
