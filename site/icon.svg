<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Shopping list app icon: a list tucked into a shopping bag">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#5E8460"/>
      <stop offset="1" stop-color="#3A5540"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="1" stop-color="#EDE4D1"/>
    </linearGradient>
    <clipPath id="bagclip">
      <path d="M316 486 L708 486 L722 796 Q727 836 685 836 L339 836 Q297 836 302 796 Z"/>
    </clipPath>
  </defs>

  <!-- full-bleed square: the stores apply their own corner mask -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512,512) scale(1.12) translate(-512,-566)">

    <!-- the list, tucked into the bag -->
    <g transform="rotate(-5 512 400)">
      <rect x="396" y="292" width="232" height="254" rx="18" fill="#FFFDF6"/>
      <g fill="#3E5C43">
        <rect x="428" y="340" width="168" height="22" rx="11"/>
        <rect x="428" y="388" width="128" height="22" rx="11"/>
        <rect x="428" y="436" width="150" height="22" rx="11"/>
      </g>
    </g>

    <!-- bag -->
    <g clip-path="url(#bagclip)">
      <path d="M316 486 L708 486 L722 796 Q727 836 685 836 L339 836 Q297 836 302 796 Z" fill="url(#paper)"/>
      <!-- rim fold -->
      <rect x="300" y="486" width="424" height="62" fill="#000000" opacity="0.12"/>
      <!-- gusset crease, so the sack does not read as a tub -->
      <rect x="404" y="548" width="7" height="300" fill="#000000" opacity="0.07"/>
    </g>
  </g>
</svg>
