# Generated into an .xcodeproj by XcodeGen: `xcodegen generate` in this directory.
#
# The project file is derived rather than committed. A .pbxproj is a generated
# artefact that reviews terribly and conflicts worse; this is the description of it,
# which is neither.
name: ShoppingList
# Values that differ per machine and per person live here rather than in the project.
# The file is gitignored; Config.example.xcconfig is the template to copy.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

options:
  bundleIdPrefix: com.cernauskas
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  # SQLite with the SQL written down, for the local copy of what the server holds.
  # SwiftData was the other candidate and is built in; see docs/offline.md for why
  # this won. Not a dependency of the watch app, which is online-only by design.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  ShoppingList:
    type: application
    platform: iOS
    sources:
      - path: ShoppingList/Sources
      - path: Shared/Sources
      - path: Auth/Sources
      - path: UI/Sources
      - path: Store/Sources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GRDB
        product: GRDB
      # Embedded, which is what puts the watch app on the watch: watchOS installs it
      # from the phone app rather than from its own download.
      - target: ShoppingListWatch
        embed: true
    info:
      path: ShoppingList/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Where the app looks for the server and which Google client it is. Both are
        # read at runtime from the bundle so that pointing the app at a different
        # server is a build setting rather than a code change.
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # SHOPPING_LIST_API_BASE_URL, GOOGLE_IOS_CLIENT_ID and
        # GOOGLE_IOS_REVERSED_CLIENT_ID deliberately have no default here. A target
        # setting outranks the project-level xcconfig, so defining them would
        # silently override Config.xcconfig with no sign the file was ignored.
        # They come from Config.xcconfig alone; the app copes with them being
        # absent (Config.apiBaseURL falls back, Identity.isConfigured reports false).

  # A single watchOS app target -- the old app-plus-extension pair has not been
  # needed since watchOS 9, and the deployment target below is well past that.
  ShoppingListWatch:
    type: application
    platform: watchOS
    sources:
      - path: ShoppingListWatch/Sources
      - path: Shared/Sources
      # The watch is not read-only: it crosses things off, which is the one thing
      # somebody does with a hand on a trolley. So it needs the same cache and the
      # same outbox as the phones -- a tick made in a shop with no signal is a
      # decision already taken, whichever screen took it.
      - path: Store/Sources
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: ShoppingListWatch/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        WKApplication: true
        # Which phone app this belongs to. Wrong, and the watch app installs as an
        # unrelated app that can never talk to its phone.
        WKCompanionAppBundleIdentifier: com.cernauskas.shoppinglist
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
    settings:
      base:
        # The suffix is not decoration: watchOS requires the watch app's id to be the
        # companion's with exactly one component added.
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.watchkitapp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"

  # The Mac app is its own target rather than Catalyst: the screens it needs are a
  # split view, a context menu and a pinned add field, none of which a stretched
  # phone layout gives you. What it shares is everything below the views --
  # Shared/Sources and Auth/Sources, byte for byte.
  ShoppingListMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Shared/Sources
      - path: Auth/Sources
      # Views the phone and the Mac both use. Not the watch: it has no keyboard
      # shortcuts, no bordered text fields, and nothing here it could show.
      - path: UI/Sources
      - path: Store/Sources
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GRDB
        product: GRDB
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
    settings:
      base:
        # The same identifier as the phone app, deliberately. Google's iOS OAuth
        # client covers macOS, and it is registered against this bundle id -- a
        # separate one would need a separate client, for the same person and the
        # same account.
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Not sandboxed. This is a personal app run from a local build against a
        # server on localhost; sandboxing it would mean an entitlements file and a
        # keychain group to hold a token that is already the phone's.
        ENABLE_HARDENED_RUNTIME: "NO"

  # Drives the Mac app the way a person does. Against `-uiTesting`, which swaps the
  # wire for an in-memory world and the sign-in for a signed-in person -- a UI test
  # cannot complete a Google flow, and should not need a server or a network to say
  # what the app does.
  MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacUITests
    dependencies:
      - target: ShoppingListMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.macuitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ShoppingListMac
        GENERATE_INFOPLIST_FILE: "YES"

  ShoppingListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShoppingListTests
    dependencies:
      - target: ShoppingList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  ShoppingListMac:
    build:
      targets:
        ShoppingListMac: all
        MacUITests: [test]
    test:
      targets:
        - MacUITests
  ShoppingList:
    build:
      targets:
        ShoppingList: all
        ShoppingListTests: [test]
    test:
      targets:
        - ShoppingListTests
