# Generated into an .xcodeproj by XcodeGen: `xcodegen generate` in this directory.
#
# The project file is derived rather than committed. A .pbxproj is a generated
# artefact that reviews terribly and conflicts worse; this is the description of it,
# which is neither.
name: ShoppingList
# Values that differ per machine and per person live here rather than in the project.
# The file is gitignored; Config.example.xcconfig is the template to copy.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

# Every target signs with the same team, set once here rather than per target.
# The value is in Config.xcconfig, which is not committed -- a different developer
# account means a different ten characters and nothing else.
settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic

options:
  bundleIdPrefix: com.cernauskas
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # SQLite with the SQL written down, for the local copy of what the server holds.
  # SwiftData was the other candidate and is built in; see docs/offline.md for why
  # this won. Not a dependency of the watch app, which is online-only by design.
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  ShoppingList:
    type: application
    platform: iOS
    sources:
      - path: ShoppingList/Sources
      - path: Shared/Sources
      # The units and tags a device with no server still needs. Shared with the
      # server, which guards it against drifting -- see domain::reference.
      - path: ../reference/reference.json
        buildPhase: resources
      - path: Auth/Sources
      - path: UI/Sources
      - path: Store/Sources
      # The shared parser. See UI/Sources/QuickAdd.swift for why it is Rust, and
      # Scripts/build-parser.sh for how it becomes a library.
      - path: Parser/include
        buildPhase: none
    dependencies:
      - package: GRDB
        product: GRDB
      # Embedded, which is what puts the watch app on the watch: watchOS installs it
      # from the phone app rather than from its own download.
      - target: ShoppingListWatch
        embed: true
    info:
      path: ShoppingList/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Where the app looks for the server, read at runtime from the bundle so
        # that pointing it somewhere else is a build setting rather than a code
        # change. There is no client id beside it any more: Sign in with Apple
        # identifies a native app by its bundle identifier and its entitlement.
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
        # C6's client half on this platform.
        #
        # `NSAllowsLocalNetworking` permits cleartext to the local network and nowhere
        # else — a server on the same Wi-Fi, which is the case a household actually
        # has. It is the one exception Apple grants without a written justification at
        # review, unlike `NSAllowsArbitraryLoads`, which is a routine cause of
        # rejection.
        #
        # It is not what enforces C6. `ServerAddress.allowsCleartext` refuses to store
        # an `http://` address at all in a release build, so this only ever matters to
        # a debug build talking to a machine on the desk. Both halves have to agree and
        # both are here for the same reason: the simulator exempts `localhost`, so
        # without this the first person to type `http://192.168.1.10` met a silent
        # failure.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # SHOPPING_LIST_API_BASE_URL and DEVELOPMENT_TEAM deliberately have no
        # default here. A target setting outranks the project-level xcconfig, so
        # defining them would silently override Config.xcconfig with no sign the
        # file was ignored. They come from Config.xcconfig alone.
        CODE_SIGN_ENTITLEMENTS: ShoppingList/ShoppingList.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Parser/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Parser/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lquickadd
    preBuildScripts:
      # Before the compile, because the library it produces is what the link step
      # looks for. `basedOnDependencyAnalysis: false` because cargo decides what needs
      # rebuilding far better than a list of inputs and outputs here could.
      - script: "\"$SRCROOT/Scripts/build-parser.sh\""
        name: Build the shared parser
        basedOnDependencyAnalysis: false


  # A single watchOS app target -- the old app-plus-extension pair has not been
  # needed since watchOS 9, and the deployment target below is well past that.
  ShoppingListWatch:
    type: application
    platform: watchOS
    sources:
      - path: ShoppingListWatch/Sources
      - path: Shared/Sources
    dependencies: []
    info:
      path: ShoppingListWatch/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        WKApplication: true
        # Which phone app this belongs to. Wrong, and the watch app installs as an
        # unrelated app that can never talk to its phone.
        WKCompanionAppBundleIdentifier: com.cernauskas.shoppinglist
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
        # C6's client half on this platform.
        #
        # `NSAllowsLocalNetworking` permits cleartext to the local network and nowhere
        # else — a server on the same Wi-Fi, which is the case a household actually
        # has. It is the one exception Apple grants without a written justification at
        # review, unlike `NSAllowsArbitraryLoads`, which is a routine cause of
        # rejection.
        #
        # It is not what enforces C6. `ServerAddress.allowsCleartext` refuses to store
        # an `http://` address at all in a release build, so this only ever matters to
        # a debug build talking to a machine on the desk. Both halves have to agree and
        # both are here for the same reason: the simulator exempts `localhost`, so
        # without this the first person to type `http://192.168.1.10` met a silent
        # failure.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # The suffix is not decoration: watchOS requires the watch app's id to be the
        # companion's with exactly one component added.
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.watchkitapp
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: "NO"

  # The Mac app is its own target rather than Catalyst: the screens it needs are a
  # split view, a context menu and a pinned add field, none of which a stretched
  # phone layout gives you. What it shares is everything below the views --
  # Shared/Sources and Auth/Sources, byte for byte.
  ShoppingListMac:
    type: application
    platform: macOS
    sources:
      - path: Mac/Sources
      - path: Shared/Sources
      - path: ../reference/reference.json
        buildPhase: resources
      - path: Auth/Sources
      # Views the phone and the Mac both use. Not the watch: it has no keyboard
      # shortcuts, no bordered text fields, and nothing here it could show.
      - path: UI/Sources
      - path: Store/Sources
      # The shared parser. See UI/Sources/QuickAdd.swift for why it is Rust, and
      # Scripts/build-parser.sh for how it becomes a library.
      - path: Parser/include
        buildPhase: none
    dependencies:
      - package: GRDB
        product: GRDB
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Shopping
        ShoppingListAPIBaseURL: $(SHOPPING_LIST_API_BASE_URL)
        # C6's client half on this platform.
        #
        # `NSAllowsLocalNetworking` permits cleartext to the local network and nowhere
        # else — a server on the same Wi-Fi, which is the case a household actually
        # has. It is the one exception Apple grants without a written justification at
        # review, unlike `NSAllowsArbitraryLoads`, which is a routine cause of
        # rejection.
        #
        # It is not what enforces C6. `ServerAddress.allowsCleartext` refuses to store
        # an `http://` address at all in a release build, so this only ever matters to
        # a debug build talking to a machine on the desk. Both halves have to agree and
        # both are here for the same reason: the simulator exempts `localhost`, so
        # without this the first person to type `http://192.168.1.10` met a silent
        # failure.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # The same identifier as the phone app, deliberately. A Sign in with Apple
        # token's audience is the bundle id, so sharing one means the server accepts
        # both apps' tokens with a single entry in APPLE_BUNDLE_IDS -- and it is one
        # app to a person either way.
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist
        CODE_SIGN_ENTITLEMENTS: Mac/ShoppingListMac.entitlements
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        # Not sandboxed. This is a personal app run from a local build against a
        # server on localhost; sandboxing it would mean an entitlements file and a
        # keychain group to hold a token that is already the phone's.
        #
        # Signed for real all the same: Sign in with Apple checks the entitlement
        # against a provisioning profile, so an ad-hoc signature would fail at the
        # button rather than at the build.
        ENABLE_HARDENED_RUNTIME: "NO"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Parser/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Parser/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: -lquickadd
    preBuildScripts:
      - script: "\"$SRCROOT/Scripts/build-parser.sh\""
        name: Build the shared parser
        basedOnDependencyAnalysis: false

  # Drives the Mac app the way a person does. Against `-uiTesting`, which swaps the
  # wire for an in-memory world and the sign-in for a signed-in person -- a UI test
  # cannot complete a Sign in with Apple flow, and should not need a server or a network to say
  # what the app does.
  MacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacUITests
    dependencies:
      - target: ShoppingListMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.macuitests
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ShoppingListMac
        GENERATE_INFOPLIST_FILE: "YES"

  ShoppingListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ShoppingListTests
    dependencies:
      - target: ShoppingList
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cernauskas.shoppinglist.tests
        GENERATE_INFOPLIST_FILE: "YES"
        # `@testable import ShoppingList` re-exports what the app imported, so the
        # tests have to be able to find the parser's module map even though they never
        # link the library themselves -- the app they are hosted in already has.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Parser/include

schemes:
  ShoppingListMac:
    build:
      targets:
        ShoppingListMac: all
        MacUITests: [test]
    test:
      targets:
        - MacUITests
  ShoppingList:
    build:
      targets:
        ShoppingList: all
        ShoppingListTests: [test]
    test:
      targets:
        - ShoppingListTests
