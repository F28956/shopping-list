[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
axum-macros = "0.5.1"
maud = { version = "0.27.0", features = ["axum"] }
openidconnect = "4.0.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
# `sync` gives BroadcastStream, which is how the change notifier becomes an SSE body.
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rmp-serde = "1.3.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "time"] }
time = "0.3.55"
async-trait = "0.1.92"

[features]
# Builds a router without the OIDC discovery round trip, so the pages can be driven
# in tests. Enabled from dev-dependencies only.
test-support = []

[dev-dependencies]
# reads an SSE body a frame at a time, which a collected response cannot do
futures = "0.3"
domain = { path = "../domain", features = ["test-support"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
rstest = "0.26.1"
serde_json = "1.0.151"
