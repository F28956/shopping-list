[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
domain = { path = "../domain" }
web = { path = "../web" }

anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "catch-panic", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower-sessions = "0.15.0"
# TLS in the process, so that reaching a working first run does not require a second
# daemon and a second configuration language -- docs/tls.md T1. Off is still the
# default, because behind a proxy that terminates TLS this is the wrong end to do it.
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
hyper = "1.11.0"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
tower = "0.5"
# `webpki-roots` is what gives `AcmeConfig::new` a client configuration to reach the
# CA with; without it only the bring-your-own-roots constructor exists.
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "tokio", "webpki-roots"] }
tokio-stream = "0.1"

[dev-dependencies]
api = { path = "../api", features = ["test-support"] }
domain = { path = "../domain", features = ["test-support"] }
http-body-util = "0.1"
rstest = "0.26.1"
tower = { version = "0.5", features = ["util"] }
