[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
api = { path = "../api" }
domain = { path = "../domain" }
web = { path = "../web" }

anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
