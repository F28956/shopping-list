[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
anyhow = "1.0.104"
axum = "0.8.9"
dotenvy = "0.15.7"
itertools = "0.15.0"
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
rustls = "0.23.43"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# No [profile.*] here. Cargo only honours profiles at the workspace root, so these
# were being silently ignored — and printing a warning on every cargo invocation to
# say so. They live in ../Cargo.toml.

[features]
# Exposes AuthMode::TrustTheToken so other crates can drive this router in tests.
# Enabled from dev-dependencies only; a release build has no such variant.
test-support = []

[dev-dependencies]
# drives the real router in-process, without binding a port
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rstest = "0.26.1"
domain = { path = "../domain", features = ["test-support"] }

[lints.rust]
# `unused = "allow"` used to be here. It hid a dozen genuinely dead imports that only
# turned up when the models moved out, and it hides unused Results too.
dead_code = "allow"
