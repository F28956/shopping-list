[package]
name = "domain"
version = "0.1.0"
edition = "2024"

# Named `domain`, not `core`: a package called `core` shadows the standard
# library's, and `use core::...` then resolves ambiguously.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
# optional: only linked when `test-support` exposes the pool fixture to other crates
rstest = { version = "0.26.1", optional = true }
time = { version = "0.3.55", features = ["serde-well-known"] }
tracing = "0.1.44"
sha2 = "0.11.0"
rand = "0.10.2"
# `sync` only: the domain needs a broadcast channel to tell watchers a list changed.
# Not "full" -- nothing in here starts a runtime or opens a socket.
tokio = { version = "1.53.1", features = ["sync"] }

[features]
# Exposes the migrated in-memory `pool` fixture so the transports can drive their
# routers against a real database in tests. Not enabled by the default build.
test-support = ["dep:rstest"]

[dev-dependencies]
# Only for the reference-data guard: reading the file the clients bundle.
serde_json = "1"
futures = "0.3"
rstest = "0.26.1"
tokio = { version = "1.53.1", features = ["full"] }

[lints.rust]
dead_code = "allow"
