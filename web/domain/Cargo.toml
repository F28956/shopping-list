[package]
name = "domain"
version = "0.1.0"
edition = "2024"

# Named `domain`, not `core`: a package called `core` shadows the standard
# library's, and `use core::...` then resolves ambiguously.

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "time"] }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known"] }
tracing = "0.1.44"

[dev-dependencies]
futures = "0.3"
rstest = "0.26.1"
tokio = { version = "1.53.1", features = ["full"] }

[lints.rust]
dead_code = "allow"
