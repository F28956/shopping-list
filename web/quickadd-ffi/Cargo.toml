[package]
name = "quickadd-ffi"
version = "0.1.0"
edition = "2024"

# A static library for the phones to link, and nothing else. The logic is `domain`'s;
# this crate only carries it across the language boundary.
[lib]
name = "quickadd"
crate-type = ["staticlib"]

[dependencies]
parsing = { path = "../parsing" }
serde_json = "1"
